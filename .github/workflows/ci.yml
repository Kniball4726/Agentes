name: CI / Automated Testing Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_call:

jobs:
  lint:
    name: Python Lint & Syntax (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.6

      - name: Run Ruff & Python 3.11 syntax check
        run: |
          ruff check src tests
          python -m compileall -q src tests

  frontend-check:
    name: PWA JS/TS Static Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run TypeScript checkJs
        run: |
          npx --yes -p typescript tsc --noEmit -p tsconfig.json
          npx --yes -p typescript tsc --noEmit -p tsconfig.sw.json

  mobile-check:
    name: Flutter Mobile Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Analyze & Test Flutter App
        working-directory: stockagent_mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if [ -d test ]; then flutter test; fi

  test:
    name: Run Pytest Suite (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest-cov

      - name: Run test suite with coverage
        env:
          PYTHONPATH: .
          PYTHONUTF8: "1"
          PYSTRAY_BACKEND: ${{ runner.os == 'Linux' && 'dummy' || '' }}
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml

      - name: Upload Coverage Report (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  dependency-audit:
    name: Python Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pip-audit on requirements.lock
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.lock --no-deps --disable-pip
