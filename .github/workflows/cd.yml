name: CD / Automated Release & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del Tag / Versión (ej: v1.0.0). Dejar vacío si se dispara desde un tag existente.'
        required: false
        default: ''
      draft:
        description: 'Crear como borrador (Draft)'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Marcar como Pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gate (CI Pipeline)
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Build Windows Desktop App (StockAgent.exe)
    runs-on: windows-latest
    needs: [quality-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-build.txt

      - name: Build Executable & Bundle
        run: |
          cmd /c scripts\build\crear_exe.bat

      - name: Smoke Test Windows Executable
        run: |
          $out = & .\dist\StockAgent.exe --version
          Write-Host "Salida smoke test: $out"
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "StockAgent") {
            Write-Error "Smoke test de StockAgent.exe falló."
            exit 1
          }

      - name: Compress Release Bundle
        run: |
          Compress-Archive -Path dist\* -DestinationPath StockAgent-Windows.zip -Force

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAgent-Windows
          path: StockAgent-Windows.zip
          retention-days: 7

  build-android:
    name: Build Android APK (StockAgent.apk)
    runs-on: ubuntu-latest
    needs: [quality-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Configure Android Release Keystore (if secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > stockagent_mobile/android/app/upload-keystore.jks
            cat <<EOF > stockagent_mobile/android/key.properties
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
            echo "Android release keystore configurado correctamente."
          else
            echo "Secrets de keystore Android no definidos; se compilará con la firma de respaldo de build.gradle."
          fi

      - name: Build Flutter Release APK
        working-directory: stockagent_mobile
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk ../StockAgent-Android.apk

      - name: Clean up Android Keystore files
        if: always()
        run: |
          rm -f stockagent_mobile/android/app/upload-keystore.jks stockagent_mobile/android/key.properties

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAgent-Android
          path: StockAgent-Android.apk
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: StockAgent-Windows
          path: .

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: StockAgent-Android
          path: .

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Generate SHA256 Checksums
        run: |
          sha256sum StockAgent-Windows.zip StockAgent-Android.apk > SHA256SUMS.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.tag }}
          files: |
            StockAgent-Windows.zip
            StockAgent-Android.apk
            SHA256SUMS.txt
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
