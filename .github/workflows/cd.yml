name: CD / Automated Release & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del Tag / Versión (ej: v1.0.0). Dejar vacío si se dispara desde un tag existente.'
        required: false
        default: ''
      draft:
        description: 'Crear como borrador (Draft)'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Marcar como Pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Syntax Check (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.6

      - name: Run Ruff & Python 3.11 syntax check
        run: |
          ruff check src tests
          python -m compileall -q src tests

  frontend-check:
    name: PWA JS/TS Static Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run TypeScript checkJs
        run: |
          npx --yes -p typescript tsc --noEmit -p tsconfig.json
          npx --yes -p typescript tsc --noEmit -p tsconfig.sw.json

  mobile-check:
    name: Flutter Mobile Static Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Analyze & Test Flutter App
        working-directory: stockagent_mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if [ -d test ]; then flutter test; fi

  test:
    name: Pytest Suite (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run test suite
        env:
          PYTHONPATH: .
          PYTHONUTF8: "1"
          PYSTRAY_BACKEND: ${{ runner.os == 'Linux' && 'dummy' || '' }}
        run: |
          python -m pytest tests/ -v --tb=short

  build-windows:
    name: Build Windows Desktop App (StockAgent.exe)
    runs-on: windows-latest
    needs: [lint, frontend-check, mobile-check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-build.txt

      - name: Build Executable & Bundle
        run: |
          cmd /c scripts\build\crear_exe.bat

      - name: Compress Release Bundle
        run: |
          Compress-Archive -Path dist\* -DestinationPath StockAgent-Windows.zip -Force

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAgent-Windows
          path: StockAgent-Windows.zip
          retention-days: 7

  build-android:
    name: Build Android APK (StockAgent.apk)
    runs-on: ubuntu-latest
    needs: [lint, frontend-check, mobile-check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Flutter Release APK
        working-directory: stockagent_mobile
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk ../StockAgent-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockAgent-Android
          path: StockAgent-Android.apk
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: StockAgent-Windows
          path: .

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: StockAgent-Android
          path: .

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Generate SHA256 Checksums
        run: |
          sha256sum StockAgent-Windows.zip StockAgent-Android.apk > SHA256SUMS.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.tag }}
          files: |
            StockAgent-Windows.zip
            StockAgent-Android.apk
            SHA256SUMS.txt
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
