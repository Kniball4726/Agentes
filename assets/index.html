<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StockAgent - Agente de control de stock y remitos.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StockAgent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-192.png">

  <!-- Favicon para navegadores -->
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <title>StockAgent</title>
  <link rel="manifest" href="manifest.json">

  <script>
    window.addEventListener('pageshow', (event) => {
      if (event.persisted &&
        navigator.vendor && navigator.vendor.startsWith('Apple')) {
        window.location.reload();
      }
    });
  </script>

  <script>
    var flet = {
      pyodide: false,
      multiView: false,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/",
      assetBase: "/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: null,
      pyodideUrl: "/pyodide/pyodide.mjs",
      webRenderer: "auto",
      fontFallbackBaseUrl: null,
      appPackageUrl: "app.tar.gz"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
    });
  </script>

  <!-- fletAppConfig -->

  <script src="python.js"></script>
</head>

<body>
  <div id="loading" role="status" aria-label="Loading">
    <style>
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #121212;
      }

      #loading img {
        width: 140px;
        max-width: 40vw;
        max-height: 40vh;
        object-fit: contain;
      }
    </style>
    <img src="favicon.png" alt="StockAgent" />
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
