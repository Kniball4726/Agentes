<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockAgent · Sin Conexión</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: rgba(211, 47, 47, 0.15);
      border: 2px solid #D32F2F;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: #334155;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      margin-bottom: 10px;
    }
    .btn-primary {
      background: #D32F2F;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #b71c1c;
    }
    .btn-secondary {
      background: #2a2a2a;
      color: #e2e8f0;
      border: 1px solid #475569;
    }
    .btn-secondary:hover {
      background: #383838;
    }
    .status-text {
      font-size: 12px;
      color: #f59e0b;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">📡</div>
    <span class="badge">STOCKAGENT PWA</span>
    <h1>Sin Conexión a la Red Local</h1>
    <p>Se interrumpió la señal WiFi con el servidor de depósito. La aplicación se reconectará automáticamente cuando se restablezca la red.</p>
    
    <button class="btn btn-primary" onclick="reintentar()">🔄 Reintentar Conexión</button>
    <a href="/scanner.html" class="btn btn-secondary">📷 Abrir Escáner de Códigos</a>
    
    <div class="status-text">
      <span class="status-dot"></span>
      <span id="txt-status">Esperando señal de red...</span>
    </div>
  </div>

  <script>
    function reintentar() {
      document.getElementById('txt-status').textContent = 'Comprobando conexión...';
      window.location.reload();
    }

    // Auto-recarga al volver la señal
    window.addEventListener('online', () => {
      document.getElementById('txt-status').textContent = '¡Red detectada! Reconectando...';
      setTimeout(() => window.location.reload(), 800);
    });
  </script>
</body>
</html>
